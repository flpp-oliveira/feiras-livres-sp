  <meta name="description" content="Mapa interativo com as 968 feiras livres de São Paulo: filtre por dia da semana e categoria, busque por bairro e veja as feiras mais perto de você." />

  <meta property="og:url" content="https://feiras-livres-sp.pages.dev/" />
  <meta property="og:title" content="Feiras Livres de São Paulo — Mapa" />
  <meta property="og:description" content="Encontre as 968 feiras livres de São Paulo no mapa: dia da semana, endereço, categoria e as mais perto de você." />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Feiras Livres de São Paulo — Mapa" />
  <meta name="twitter:description" content="Encontre as 968 feiras livres de São Paulo no mapa: dia, endereço, categoria e as mais perto de você." />
  <meta name="twitter:image" content="https://feiras-livres-sp.pages.dev/og-image.png" />

  <link rel="stylesheet" href="fonts/fonts.css?v=40" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=40" />
  <link rel="stylesheet" href="style.css?v=40" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header>
        <div class="marca">
          <span class="marca-badge">🧺</span>
          <div class="marca-txt">
            <h1>Feiras Livres <span>SP</span></h1>
            <p class="sub">toda a cidade em um mapa</p>
          </div>
        </div>
      </header>

      <div class="acoes">
        <button id="hoje" type="button">
          <span class="acao-icone">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="16" rx="3"></rect>
              <path d="M3 10h18"></path>
              <path d="M8 3v4M16 3v4"></path>
            </svg>
          </span>
          <span class="acao-label">Feiras hoje</span>
        </button>
        <button id="perto" type="button">
          <span class="acao-icone">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"></path>
              <circle cx="12" cy="10" r="2.5"></circle>
            </svg>
          </span>
          <span class="acao-label">Perto de mim</span>
        </button>
      </div>

      <div class="field">
        <label for="busca">Buscar</label>
        <div class="busca-wrap">
          <input type="search" id="busca" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="busca-sugestoes" aria-autocomplete="list" />
          <ul id="busca-sugestoes" class="busca-sugestoes" role="listbox" hidden></ul>
        </div>
      </div>

      <div class="field">
        <label>🗓️ Dia da semana</label>
        <div id="filtro-dias" class="chips"></div>
      </div>

      <div class="field">
        <label>🧺 Categoria</label>
        <div id="filtro-categorias" class="chips"></div>
      </div>

      <footer>
        <p>Dados: Prefeitura de São Paulo / SMSUB (set/2024).<br />
        Coordenadas: Google (via My Maps) e OpenStreetMap — podem ter imprecisão.</p>
        <p class="credito">Feito por <span>OpenX</span></p>
      </footer>
    </aside>

    <main id="map"></main>

    <div id="vazio" hidden>
      <div class="vazio-card">
        <span class="vazio-emoji">🧺💨</span>
        <p>Nenhuma feira encontrada com esses filtros.</p>
        <button id="vazio-limpar" type="button">Limpar filtros</button>
      </div>
    </div>

    <aside id="lista-perto" hidden aria-label="Feiras perto de você">
      <header>
        <span id="lp-titulo"></span>
        <button id="lp-min" type="button" aria-label="Minimizar lista">–</button>
      </header>
      <ul id="lp-itens"></ul>
    </aside>

    <div id="toast" role="status" aria-live="polite"></div>

    <button id="voltar-localizacao" type="button" aria-label="Voltar para minha localização">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"></circle>
        <circle cx="12" cy="12" r="7.2"></circle>
        <path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"></path>
      </svg>
    </button>

    <button id="colapsar-sidebar" type="button" aria-label="Colapsar filtros">‹</button>
    <button id="toggle-sidebar" type="button" aria-label="Mostrar/ocultar filtros">☰ Filtros</button>
  </div>

  <script src="vendor/leaflet/leaflet.js?v=40"></script>
  <script src="feiras-data.js?v=40"></script>
  <script src="app.js?v=40"></script>

  <!-- Cloudflare Web Analytics (medição sem cookies; token é público por design) -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "2eb060762d524d85ad7d70e2b67fa203"}'></script>
</body>
</html>
